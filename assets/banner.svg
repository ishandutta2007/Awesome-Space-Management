<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid pattern -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" />
  </g>

  <!-- Office floorplan graphic -->
  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="300" height="240" fill="#1e293b" stroke="#334155" stroke-width="2" rx="12" />
    <text x="20" y="30" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">FLOOR PLAN - ZONE A</text>

    <!-- Desks -->
    <rect x="30" y="60" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="60" cy="80" r="8" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <rect x="120" y="60" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="150" cy="80" r="8" fill="#ef4444" />

    <rect x="210" y="60" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="240" cy="80" r="8" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <rect x="30" y="140" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="60" cy="160" r="8" fill="#f59e0b" />

    <rect x="120" y="140" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="150" cy="160" r="8" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <rect x="210" y="140" width="60" height="40" fill="#334155" rx="6" />
    <circle cx="240" cy="160" r="8" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="240" height="32" fill="#312e81" rx="16" />
    <text x="120" y="21" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏢 HYBRID WORKPLACE ECOSYSTEM</text>

    <text x="0" y="85" fill="url(#textGrad)" font-family="Segoe UI, sans-serif" font-size="44" font-weight="800">Awesome Space Management</text>
    <text x="0" y="125" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="18">Desk Booking • Room Reservation • Floor Plans • Occupancy Analytics</text>

    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">10+ Top SaaS Platforms</text>
      <text x="210" y="0" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">8+ Starred Open-Source Tools</text>
      <text x="460" y="0" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">$3.8B Market Overview</text>
    </g>
  </g>
</svg>